[package]
name = "steam-pulse"
version = "4.8.4"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.37"
url = "2"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
tao = "0.34"
winreg = "0.55"
wry = "0.53"
windows-numerics = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading",
    "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation", "Win32_Globalization", "Win32_System_ProcessStatus",
    "Win32_Graphics_Dwm", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_UI_Accessibility",
] }

[profile.release]
strip = true
lto = "thin"
